name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Check browser engine and causal signal identity
        run: node marketpulse/_engine/check.mjs
      - name: Generate verified live public market feed
        run: node marketpulse/_engine/publish.mjs
      - name: Install browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/marketpulse-browser" playwright@1.56.1
          "$RUNNER_TEMP/marketpulse-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify every main control on the GitHub Pages path
        env:
          PLAYWRIGHT_MODULE: file://${{ runner.temp }}/marketpulse-browser/node_modules/playwright/index.mjs
        run: node marketpulse/_engine/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketpulse-browser-checks
          path: marketpulse-checks/
          retention-days: 2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish verified site
        id: deployment
        uses: actions/deploy-pages@v4
